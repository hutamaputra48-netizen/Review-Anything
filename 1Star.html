<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>1 Star Reviews</title>
  <style>
    :root {
      font-family: "Noto Sans JP", "Hiragino Kaku Gothic Pro", Meiryo, sans-serif;
      color: #2c2120;
      background: #f8f0ec;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(circle at top, #fff5f2, #f1d9d1 45%, #e8c4b8 100%);
    }

    .container {
      width: min(100%, 960px);
      background: #fff8f6;
      border-radius: 18px;
      box-shadow: 0 24px 52px rgba(111, 59, 49, 0.12);
      overflow: hidden;
    }

    header {
      padding: 34px 34px 24px;
      background: linear-gradient(135deg, #c83229 0%, #f0c1b5 100%);
      color: #fff;
    }

    header h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 4vw, 3rem);
      line-height: 1.05;
      text-shadow: 0 1px 9px rgba(0, 0, 0, 0.18);
    }

    header p {
      margin: 0 0 16px;
      opacity: 0.92;
      max-width: 680px;
    }

    .header-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      background: #fff;
      color: #c83229;
      padding: 12px 18px;
      border-radius: 999px;
      font-weight: 700;
      box-shadow: 0 10px 24px rgba(168, 48, 39, 0.18);
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .btn-link:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 28px rgba(168, 48, 39, 0.24);
      background: #fff5f4;
    }

    main {
      padding: 32px;
    }

    .card {
      background: #fff7f2;
      border: 1px solid #f4d5cf;
      border-radius: 16px;
      padding: 26px;
      margin-bottom: 24px;
    }

    .review-list {
      display: grid;
      gap: 18px;
    }

    .review-item {
      padding: 22px;
      border-radius: 16px;
      border: 1px solid #f1d2cb;
      background: #fff;
    }

    .review-item h3 {
      margin: 0 0 8px;
      font-size: 1.1rem;
    }

    .review-item small {
      color: #6d7a8a;
    }

    .review-item p {
      margin: 12px 0 0;
      line-height: 1.7;
    }

    .empty-state {
      text-align: center;
      color: #7b6b6a;
      padding: 36px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>1 Star Reviews</h1>
      <p>Menampilkan semua review dengan 1 bintang dari halaman review.</p>
      <div class="header-actions">
        <a href="index.html" class="btn-link">Kembali ke Review</a>
        <a href="Recommendations.html" class="btn-link">Lihat Rekomendasi</a>
        <a href="Community.html" class="btn-link">Community</a>
        <a href="1Star.html" class="btn-link">1 Star Reviews</a>
      </div>
    </header>

    <main>
      <section class="card">
        <h2>Review 1 Star</h2>
        <div id="reviews" class="review-list"></div>
      </section>
    </main>
  </div>

  <script>
    const STORAGE_KEY = 'review-anything-reviews';
    const reviewsContainer = document.getElementById('reviews');

    function getReviews() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      } catch {
        return [];
      }
    }

    function createReviewCard(review) {
      const item = document.createElement('div');
      item.className = 'review-item';

      const title = document.createElement('h3');
      title.textContent = review.subject || 'Untitled review';
      item.appendChild(title);

      const meta = document.createElement('small');
      meta.textContent = `${review.rating} star${review.rating === '1' ? '' : 's'}${review.name ? ` • by ${review.name}` : ''}`;
      item.appendChild(meta);

      const body = document.createElement('p');
      body.textContent = review.text || 'No details provided yet.';
      item.appendChild(body);

      return item;
    }

    function renderReviews() {
      const reviews = getReviews().filter((review) => review.rating === '1');
      reviewsContainer.innerHTML = '';

      if (!reviews.length) {
        reviewsContainer.innerHTML = '<div class="empty-state">Belum ada review 1 bintang.</div>';
        return;
      }

      reviews.forEach((review) => {
        reviewsContainer.appendChild(createReviewCard(review));
      });
    }

    renderReviews();
  </script>
</body>
</html>
