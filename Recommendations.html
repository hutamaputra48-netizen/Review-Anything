<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rekomendasi</title>
  <style>
    :root {
      font-family: "Noto Sans JP", "Hiragino Kaku Gothic Pro", Meiryo, Arial, sans-serif;
      color: #362828;
      background: #f9eef3;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(circle at top, #fff0f4, #f8d9e4 35%, #f2c3d6 100%);
    }

    .container {
      width: min(100%, 960px);
      background: #fff7f5;
      border-radius: 20px;
      box-shadow: 0 24px 48px rgba(70, 30, 40, 0.12);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.8);
    }

    header {
      padding: 34px 34px 24px;
      background: linear-gradient(135deg, #c94b5a 0%, #f8b7c5 100%);
      color: #fff;
      background-image:
        linear-gradient(135deg, #c94b5a 0%, #f8b7c5 100%),
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.28), transparent 18%),
        repeating-linear-gradient(
          45deg,
          rgba(255,255,255,0.12),
          rgba(255,255,255,0.12) 1px,
          transparent 1px,
          transparent 12px
        );
    }

    header h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 4vw, 3rem);
      line-height: 1.05;
      letter-spacing: 0.02em;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.16);
    }

    header p {
      margin: 0 0 16px;
      opacity: 0.9;
      max-width: 680px;
    }

    .header-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      background: #fff;
      color: #c94b5a;
      padding: 12px 18px;
      border-radius: 999px;
      font-weight: 700;
      box-shadow: 0 10px 24px rgba(201, 84, 96, 0.18);
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .btn-link:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 28px rgba(201, 84, 96, 0.26);
      background: #fff5f6;
    }

    main {
      padding: 32px;
    }

    .card {
      background: #fff4f3;
      border: 1px solid #f2d3d8;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
    }

    .review-list {
      display: grid;
      gap: 18px;
    }

    .review-item {
      padding: 22px;
      border-radius: 16px;
      border: 1px solid #efd2d8;
      background: #fff;
    }

    .review-item h3 {
      margin: 0 0 8px;
      font-size: 1.1rem;
    }

    .review-item small {
      color: #6d7a8a;
    }

    .review-item p {
      margin: 12px 0 0;
      line-height: 1.7;
    }

    .empty-state {
      text-align: center;
      color: #7b6b6a;
      padding: 36px 0;
    }

    header marquee {
      display: block;
      margin-bottom: 18px;
      padding: 10px 0;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.4);
      overflow: hidden;
    }

    header marquee img {
      width: 120px;
      height: 120px;
      object-fit: cover;
      margin-right: 16px;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      filter: drop-shadow(0 14px 24px rgba(0, 0, 0, 0.15));
      transition: transform 0.25s ease, filter 0.25s ease;
      animation: float 4s ease-in-out infinite alternate;
    }

    header marquee img:hover {
      transform: scale(1.07) rotate(-1deg);
      filter: drop-shadow(0 18px 30px rgba(0, 0, 0, 0.24));
    }

    @keyframes float {
      from { transform: translateY(0); }
      to { transform: translateY(-10px); }
    }

    @media (max-width: 720px) {
      .container {
        padding: 0;
      }

      main {
        padding: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <marquee behavior="scroll" direction="left" scrollamount="8">
        <img src="926123110889036755.jpg" alt="photo 1" />
        <img src="Yang Yang - Xuangling 🐦.jpg" alt="photo 2" />
        <img src="- - Y.jpg" alt="photo 3" />
        <img src="blue archive meme.jpg" alt="photo 4" />
        <img src="1131036893918549190.webp" alt="photo 5" />
        <img src="bobok 💤💤💤.jpg" alt="photo 6" />
      </marquee>

      <h1>Rekomendasi</h1>
      <p>Berisi review bintang 5 yang direkomendasikan.</p>
      <div class="header-actions">
        <a href="index.html" class="btn-link">Kembali ke Review</a>
      </div>
    </header>

    <main>
      <section class="card">
        <div id="recommendations" class="review-list"></div>
      </section>
    </main>
  </div>

  <script>
    const RECOMMENDATIONS_KEY = 'review-anything-recommendations';
    const recommendationsContainer = document.getElementById('recommendations');

    function getRecommendations() {
      try {
        return JSON.parse(localStorage.getItem(RECOMMENDATIONS_KEY) || '[]');
      } catch {
        return [];
      }
    }

    function createRecommendationCard(review) {
      const item = document.createElement('div');
      item.className = 'review-item';

      const title = document.createElement('h3');
      title.textContent = review.subject || 'Ulasan tanpa judul';
      item.appendChild(title);

      const meta = document.createElement('small');
      meta.textContent = `${review.rating} star${review.rating === '1' ? '' : 's'}${review.name ? ` • oleh ${review.name}` : ''}`;
      item.appendChild(meta);

      const body = document.createElement('p');
      body.textContent = review.text || 'Belum ada detail tersedia.';
      item.appendChild(body);

      return item;
    }

    function renderRecommendations() {
      const recommendations = getRecommendations();
      recommendationsContainer.innerHTML = '';

      if (!recommendations.length) {
        recommendationsContainer.innerHTML = '<div class="empty-state">Belum ada review 5 bintang.</div>';
        return;
      }

      const list = document.createElement('div');
      list.className = 'review-list';

      recommendations.forEach((review) => {
        list.appendChild(createRecommendationCard(review));
      });

      recommendationsContainer.appendChild(list);
    }

    window.addEventListener('storage', (event) => {
      if (event.key === RECOMMENDATIONS_KEY) {
        renderRecommendations();
      }
    });

    renderRecommendations();
  </script>
</body>
</html>
